version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: grantflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: grantflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d grantflow']
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: grantflow-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@grantflow.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: grantflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/grantflow
      NODE_ENV: development
      PORT: 3000
      AI_RUNTIME_URL: http://ai-runtime:8000
      AUTH_SECRET: grantflow-local-auth-secret
    ports:
      - '3001:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  ai-runtime:
    build:
      context: ./ai-runtime
      dockerfile: Dockerfile
    container_name: grantflow-ai-runtime
    restart: unless-stopped
    environment:
      APP_ENV: development
      OPENAI_MODEL: gpt-4o-mini
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_DISABLE_LLM: ${AI_DISABLE_LLM:-false}
    ports:
      - '8001:8000'
    volumes:
      - ./ai-runtime:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: grantflow-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5174:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
  pgadmin_data:
